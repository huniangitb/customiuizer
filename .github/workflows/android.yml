name: Android CI

on:
  push:
    branches: ["a14-api101-2" ]
  pull_request:
    branches: [ "a14-api101-2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate dummy keystore
      run: |
        keytool -genkey -v \
          -keystore ../dummy.jks \
          -alias dummy \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass 123456 \
          -keypass 123456 \
          -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=CN" \
          -noprompt

    - name: Create keystore.properties
      run: |
        cat > ../keystore.properties << 'EOF'
        storeFile=../dummy.jks
        storePassword=123456
        keyAlias=dummy
        keyPassword=123456
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build develop APK
      run: ./gradlew assembleDevelop

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: customiuizer-apk
        path: app/build/outputs/apk/develop/*.apk
